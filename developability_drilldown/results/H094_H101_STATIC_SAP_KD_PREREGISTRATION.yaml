    engine: Bio.PDB.SASA.ShrakeRupley
    probe_A: 1.4
    n_points: 100
    n_points_label: SOURCE_SPECIFIED
    numerator: TOTAL_RESIDUE_SASA
    maxasa: Tien2013
    tien_maxasa_table:
      A: 129.0
      R: 274.0
      N: 195.0
      D: 193.0
      C: 167.0
      Q: 225.0
      E: 223.0
      G: 104.0
      H: 224.0
      I: 197.0
      L: 201.0
      K: 236.0
      M: 224.0
      F: 240.0
      P: 159.0
      S: 155.0
      T: 172.0
      W: 285.0
      Y: 263.0
      V: 174.0
  hydrophobicity:
    scale: Kyte-Doolittle 1982
    normalization: min-max over 20 AA
    KD_min: -4.5
    KD_max: 4.5
    table:
      A: 1.8
      R: -4.5
      N: -3.5
      D: -3.5
      C: 2.5
      Q: -3.5
      E: -3.5
      G: -0.4
      H: -3.2
      I: 4.5
      L: 3.8
      K: -3.9
      M: 1.9
      F: 2.8
      P: -1.6
      S: -0.8
      T: -0.7
      W: -0.9
      Y: -1.3
      V: 4.2
  centroid:
    definition: arithmetic mean of non-hydrogen side-chain atoms
    excluded_backbone:
    - N
    - CA
    - C
    - O
    - OXT
    gly_fallback: CA
  include_self: true
  no_distance_decay: true
  no_plddt_weighting: true
  SAP3_cols:
  - SSKD_ALL_MAX
  - SSKD_ALL_MEAN
  - SSKD_ALL_SUM
  SAP9_cols:
  - SSKD_ALL_MAX
  - SSKD_ALL_MEAN
  - SSKD_ALL_SUM
  - SSKD_H_MAX
  - SSKD_H_MEAN
  - SSKD_H_SUM
  - SSKD_L_MAX
  - SSKD_L_MEAN
  - SSKD_L_SUM
  SAP9_note: H/L aggregation selects CENTER residues only; neighborhood remains full
    H+L
